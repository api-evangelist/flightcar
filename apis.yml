name: FlightCar
description: >-
  FlightCar was a United States peer-to-peer car-rental marketplace built around
  airport travel, surfaced into the API Evangelist network as an a16z portfolio
  lead. Enrichment probing on 2026-07-20 found no operating company behind the
  name and no API surface of any kind. The domain flightcar.com is registered
  but publishes no A, AAAA or MX records, resolves to no host, and sits on
  Njalla privacy nameservers with a SOA serial dated 2026-07-18; the api,
  developer and docs subdomains do not resolve; there is no GitHub organisation
  at github.com/flightcar; and no first-party client library exists on npm or
  PyPI. The Internet Archive shows the consumer site returning 200 through May
  2016 and an Internal Server Error by July 2017, with no successful captures
  in 2017 or 2018. FlightCar is therefore carried in the network as a defunct
  company retained for portfolio-graph and historical continuity rather than as
  an active API provider, and should not be re-queued for artifact enrichment.
